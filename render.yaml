# Render Blueprint for Shopify countdown-pro app
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: countdown-pros
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SHOPIFY_APP_URL
        value: https://countdown-pros.onrender.com
      - key: SCOPES
        value: write_products
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: countdown-pro-db
          property: connectionString

databases:
  - name: countdown-pro-db
    plan: free
    region: frankfurt
    databaseName: countdown_pro
    user: countdown_pro
