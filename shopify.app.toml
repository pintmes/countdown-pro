# This file stores configurations for your Shopify app.
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration

name = "countdown-pro"
handle = "countdown-pro"
client_id = ""
application_url = "https://countdown-pros.onrender.com"
embedded = true

[build]
include_config_on_deploy = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products: list products when targeting a timer to specific products
# read_themes:   detect whether the merchant has enabled the app embed
scopes = "read_products,read_themes"

[auth]
redirect_urls = [
  "https://countdown-pros.onrender.com/auth/callback",
  "https://countdown-pros.onrender.com/auth/shopify/callback",
  "https://countdown-pros.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Mandatory GDPR compliance topics for public apps.
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

[pos]
embedded = false
